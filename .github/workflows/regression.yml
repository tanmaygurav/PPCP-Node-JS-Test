name: Offline regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:local
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:mock
      - run: npm run build:m02
      - run: npm run test:m02
      - run: npm run test:m02:emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/test-runs/*.json
          retention-days: 90
          if-no-files-found: warn
